name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ["1.25.x", "1.26.x"]
    steps:
      - name: Check out extension
        uses: actions/checkout@v4
        with:
          path: horizon

      - name: Check out framework
        uses: actions/checkout@v4
        with:
          repository: prismgo/framework
          path: framework

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: horizon/go.sum

      - name: Verify declared module dependencies
        working-directory: horizon
        env:
          GOWORK: "off"
        run: go build ./...

      - name: Create workspace
        run: go work init ./framework ./horizon

      - name: Test extension
        working-directory: horizon
        run: go test -race -count=1 ./...

  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25.x", "1.26.x"]
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out extension
        uses: actions/checkout@v4
        with:
          path: horizon

      - name: Check out framework
        uses: actions/checkout@v4
        with:
          repository: prismgo/framework
          path: framework

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: horizon/go.sum

      - name: Create workspace
        run: go work init ./framework ./horizon

      - name: Test with race detector and real Redis
        working-directory: horizon
        env:
          PRISMGO_REDIS_TEST_ADDR: 127.0.0.1:6379
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Enforce 90 percent statement coverage
        working-directory: horizon
        run: |
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          awk -v coverage="$coverage" 'BEGIN { if (coverage + 0 < 90) exit 1 }'
